service:
  name: rat-c2-server
  type: web
  plan: free

  # Use Docker instead of Go build pack
  dockerfile: ./Dockerfile

  # Service settings
  envVars:
    - key: PORT
      value: "8080"
    - key: DATABASE_PATH
      value: ./data/ratc2.db
    - key: server.api_addr
      value: 0.0.0.0:8080
    - key: server.ws_addr
      value: 0.0.0.0:8081
    - key: server.tls_enabled
      value: "false"
    - key: logging.level
      value: info

  # Health check
  healthCheckPath: /health
  healthCheckInterval: 30
  healthCheckTimeout: 5

  # Auto-deploy from main branch
  autoDeploy: true